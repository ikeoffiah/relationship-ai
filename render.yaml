# Render blueprint — the 0-to-2-couples pilot stack.
#
# Deliberately not the production topology. Three things are traded away and
# each is a real cost, named here so nobody discovers them during a test:
#
#   1. Free instances sleep after ~15 minutes idle and cold-start in ~50s. The
#      first message of a session waits. Tell the couple.
#   2. No *separate* Celery service — background workers are paid-only. The web
#      container starts a worker alongside gunicorn instead (see
#      backend-django/start.sh); it shares 512 MB and dies with the web
#      process, which is wrong for production and correct for a pilot.
#      Without it, partner invites are queued and never sent while the API
#      reports success — the pilot silently cannot pair.
#      Still missing: celery *beat*. So nothing scheduled runs — the connection
#      score does not refresh nightly, user-set reminders never fire, weekly
#      insights are never synthesised. Run those by hand (see below).
#   3. 512 MB per instance. Django fits comfortably. The FastAPI service
#      carries LangGraph and embedding libraries and may not — if it OOMs on
#      boot, that is the one service to put on a paid plan, not both.
#
# Postgres and Redis are NOT defined here on purpose. Use Supabase (you need
# pgvector, which Render's Postgres does not have) and Upstash.

services:
  - type: web
    name: bliss-django
    runtime: docker
    plan: free
    rootDir: backend-django
    dockerfilePath: ./Dockerfile
    # A script, not an inline command. The Dockerfile CMD is `manage.py
    # runserver` and Render uses the image CMD while ignoring the Procfile, so
    # this override is what actually decides how the service starts. It was
    # inline until Render passed `sh -c "a && b"` through as a single command
    # name and sh reported the whole string as "not found" — YAML, Render and
    # sh are three chances to get quoting wrong, and a file has none.
    # start.sh runs migrations then execs gunicorn; the reasoning is in it.
    dockerCommand: sh ./start.sh
    healthCheckPath: /health/
    envVars:
      # Generate: python -c "import secrets; print(secrets.token_urlsafe(64))"
      # No default exists any more — the service will refuse to boot without it.
      - key: SECRET_KEY
        sync: false
      - key: DEBUG
        value: "false"
      - key: ALLOWED_HOSTS
        value: bliss-django.onrender.com
      - key: DATABASE_URL
        sync: false          # Supabase → Settings → Database → Connection string
      - key: REDIS_URL
        sync: false          # Upstash → rediss:// URL
      - key: OPENAI_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false          # optional; safe to leave unset for a pilot
      - key: FASTAPI_INTERNAL_URL
        value: https://bliss-fastapi.onrender.com
      - key: INTERNAL_SERVICE_TOKEN
        sync: false          # must match the FastAPI service exactly
      # Email — Resend's HTTP API, not SMTP: Render free instances block outbound
      # 25/465/587 (Sept 2025, anti-spam) and port 25 stays blocked on paid
      # instances too. The SMTP backend hangs to EMAIL_TIMEOUT against a
      # blocked port and surfaces as TimeoutError inside a Celery retry, which
      # looks like a slow mail server rather than a closed port.
      - key: RESEND_API_KEY
        sync: false          # the re_… key from resend.com/api-keys
      - key: EMAIL_HOST_PASSWORD
        sync: false          # same key; read as a fallback by the backend
      # DEFAULT_FROM_EMAIL must be on a domain verified at resend.com/domains.
      # onboarding@resend.dev is Resend's shared sandbox sender and can ONLY
      # deliver to the Resend account owner's own address — every other
      # recipient is refused with a 550. Partner invites go to the partner, so
      # the sandbox sender cannot pair a couple.
      - key: DEFAULT_FROM_EMAIL
        sync: false

  - type: web
    name: bliss-fastapi
    runtime: docker
    plan: free
    rootDir: backend-fastapi
    dockerfilePath: ./Dockerfile
    # The Dockerfile CMD hardcodes --port 8001 and --reload. Render assigns the
    # port at runtime, so the container would bind the wrong one and the reloader
    # has no place in a deployed service.
    dockerCommand: sh ./start.sh
    healthCheckPath: /health
    envVars:
      # Must be byte-identical to the Django SECRET_KEY. Django signs the JWTs;
      # this service verifies them. A mismatch surfaces as a bare 403 that reads
      # like a permissions bug — both services log a key fingerprint at startup
      # precisely so you can compare them.
      - key: SECRET_KEY
        sync: false
      # Without this the service falls back to the in-code default
      # (localhost,testserver,ws.relationshipai.com) and TrustedHostMiddleware
      # 400s every request including Render's health check — the service runs
      # perfectly and never passes. The Django side works only because its
      # ALLOWED_HOSTS is set, which is also the proof that Render's health
      # check sends the real external hostname rather than an internal address.
      - key: ALLOWED_HOSTS
        value: bliss-fastapi.onrender.com,localhost,testserver
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: INTERNAL_SERVICE_TOKEN
        sync: false
      # JSON array. The service now REFUSES TO BOOT without this, because an
      # ungated path to an empty list is the same outcome for someone in crisis
      # as a paywall. Example:
      #   [{"name":"Samaritans","phone":"116 123","region":"UK"},
      #    {"name":"988 Suicide & Crisis Lifeline","phone":"988","region":"US"}]
      # Use numbers that are correct for where your test couple actually lives.
      - key: CRISIS_RESOURCES
        sync: false

# ── Running the jobs Celery would have run ────────────────────────────────────
#
# From the Django service's Render shell, whenever you want the connection
# score to move:
#
#   python manage.py shell -c "from personalization.tasks import \
#     refresh_connection_scores; refresh_connection_scores()"
#
# Migrations run automatically — backend-django/start.sh applies them on every
# boot, because Render's preDeployCommand is paid-only. Nothing to do by hand.
# The first boot applies ~100 of them and is noticeably slower than later ones.
