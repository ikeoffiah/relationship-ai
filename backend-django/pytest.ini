[pytest]
DJANGO_SETTINGS_MODULE = config.settings
# tests_*.py included so a plausible-looking name cannot silently go
# uncollected -- a file named tests_authorization.py matched none of the
# previous patterns and its tests never ran in CI.
python_files = tests.py test_*.py *_tests.py tests_*.py

# --reuse-db is deliberately NOT here.
#
# It reuses the test database without re-running migrations, so a database
# created before a migration existed keeps serving the old schema and, worse,
# never picks up RunPython data migrations. That is how the seeded This-or-That
# pack came to be missing: the test asserting it is listed failed for months
# against code that was correct, was filed alongside the genuine
# SQLite-vs-Postgres failures as "known", and stopped being read.
#
# Correctness should not be the opt-in. Pass --reuse-db explicitly when
# iterating on one file and you know the schema has not moved.
