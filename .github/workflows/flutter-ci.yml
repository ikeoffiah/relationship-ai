name: Flutter CI

on:
  push:
    branches: [main, develop, prod]
  pull_request:
    branches: [main, develop, prod]
    paths:
      - "mobile/**"
      - "shared/**"

jobs:
  flutter-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
      - run: flutter pub get
        working-directory: mobile/
      - run: flutter analyze --fatal-warnings
        working-directory: mobile/
      - run: flutter test --coverage
        working-directory: mobile/
      # The real google-services.json is gitignored (holds client keys); supply a
      # placeholder so the release build's Google Services Gradle task can run.
      - name: Provide placeholder google-services.json for the build
        working-directory: mobile/
        run: |
          if [ ! -f android/app/google-services.json ]; then
            cp android/app/google-services.json.example android/app/google-services.json
            echo "Using placeholder google-services.json for CI build."
          fi
      - run: flutter build apk --release
        working-directory: mobile/
